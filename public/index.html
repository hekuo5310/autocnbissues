        <span class="logo-text">喵聚 <em>Issues</em></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="#/new" data-nav="new">提交 Issue</a>
        <a href="#/issues" data-nav="issues">Issue 列表</a>

          <span class="logo-mark-sm" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="4.5" cy="9.5" r="2"/><circle cx="9" cy="5.5" r="2"/><circle cx="15" cy="5.5" r="2"/><circle cx="19.5" cy="9.5" r="2"/><path d="M17.34 14.86c-.87-1.02-1.6-1.89-2.48-2.91-.46-.54-1.05-1.08-1.75-1.32-.11-.04-.22-.07-.33-.09-.25-.04-.52-.04-.78-.04s-.53 0-.79.05c-.11.02-.22.05-.33.09-.7.24-1.28.78-1.75 1.32-.87 1.02-1.6 1.89-2.48 2.91-1.31 1.31-2.92 2.76-2.62 4.79.29 1.02 1.02 2.03 2.33 2.32.73.15 3.06-.29 5.54-.29h.18c2.48 0 4.81.44 5.54.29 1.31-.29 2.04-1.31 2.33-2.32.31-2.04-1.3-3.49-2.61-4.8z"/></svg>

          <span>喵聚 Issues</span>
        </div>

      </div>

  <!-- 登录弹窗 -->
  <div class="modal-mask" id="login-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <button class="modal-close" id="login-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <h2 id="login-title">登录喵聚 Issues</h2>
      <p class="modal-sub">使用邮箱验证码登录，无需密码。登录后可提交 Issue 并参与回复。</p>

      <div class="form-field">
        <label for="login-email">邮箱地址</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-field" id="code-row" hidden>
        <label for="login-code">验证码 <span class="muted">（已发送至邮箱，10 分钟内有效）</span></label>
        <div class="code-row">
          <input type="text" id="login-code" inputmode="numeric" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code" />
          <button class="btn btn-outline" id="btn-resend" disabled>60s 后重发</button>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btn-next">获取验证码</button>
      <p class="login-error" id="login-error" role="alert"></p>
      <p class="login-tip" id="login-tip" hidden></p>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap" aria-live="assertive"></div>

  <script src="/core.js"></script>
  <script src="/views.js"></script>

</html>
